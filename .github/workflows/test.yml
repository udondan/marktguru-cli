---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Only one run at a time may run the live tests against Marktguru.
  boarding-gate:
    name: Queue
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The test job only runs if code or build config changed. Skipped outside of
  # pull requests, so pushes to main and workflow_dispatch always run it. Waits
  # for boarding-gate like everything else: while another run holds the turn,
  # this one likely needs a rebase anyway.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - src/**
              - tests/**
              - package.json
              - bun.lock
              - mise.toml
              - Makefile
              - tsconfig*.json
              - eslint.config.js
              - .prettierrc
              - .prettierignore
              - .c8rc.json
              - .github/workflows/test.yml

  test:
    needs: [boarding-gate, changes]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. Skip it if no code
    # changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC

    defaults:
      run:
        shell: bash

    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js and Bun
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node bun # versions from mise.toml

      - name: Install dependencies
        run: make install

      - name: Linting
        run: make eslint

      - name: Test
        run: make test

      # main uploads its coverage in the Coverage workflow, without waiting
      # for the turn. For forks the action uploads without a token instead of OIDC.
      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage/lcov.info

      - name: Validate package
        run: make validate-package

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  actions:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # Code smells (complexity, duplication, nesting) via Qlty. Git-aware: only
  # smells introduced by the PR compared to main fail the job.
  qlty:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the test job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check turn
        if: needs.boarding-gate.result != 'success'
        run: exit 1

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install qlty
        uses: qltysh/qlty-action/install@0ff2178667bf8eb28ed0013a7ef54857a24d4056 # v2.7.0

      - name: Lint via qlty plugins
        run: qlty check --all

      - name: Report code smells
        if: github.event_name != 'pull_request'
        run: qlty smells --all --no-snippets

      - name: Report new code smells
        if: github.event_name == 'pull_request'
        run: qlty smells --upstream origin/main --no-snippets

      - name: Fail on new code smells
        if: github.event_name == 'pull_request'
        run: |
          count=$(qlty smells --upstream origin/main --json --quiet 2>/dev/null | jq length)
          if [ "$count" -gt 0 ]; then
            echo "::error::qlty found $count new code smell(s) compared to main"
            exit 1
          fi

  # The only test check the ruleset requires, whatever jobs are added later.
  # changes and coverage are skipped outside of pull requests, which counts as
  # passed here.
  required:
    needs: [boarding-gate, changes, test, coverage, actions, qlty]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
