config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/coverage/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
  "**/.claude/**",
  "**/.npm/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "block"

[[source]]
name = "default"
default = true

# Known vulnerabilities in the locked npm dependencies
[[plugin]]
name = "osv-scanner"

# Vulnerabilities, secrets and misconfigurations
[[plugin]]
name = "trivy"

# Secrets committed to the repository
[[plugin]]
name = "gitleaks"

[[plugin]]
name = "trufflehog"

# Bugs and security hotspots in TypeScript and JavaScript
[[plugin]]
name = "radarlint-js"

# Fake API keys the tests use as fixtures for the scraper and the config output
[[triage]]
match.rules = ["gitleaks:generic-api-key"]
match.file_patterns = [
  "tests/auth.test.ts",
  "tests/login.test.ts",
  "tests/program.test.ts",
]
set.ignored = true

# The test throws a non-Error on purpose to check that it gets wrapped
[[triage]]
match.rules = ["radarlint-js:typescript:S3696"]
match.file_patterns = ["tests/auth.test.ts"]
set.ignored = true
